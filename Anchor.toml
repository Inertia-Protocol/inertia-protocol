[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
inertia_protocol = "8ST3LRU5gv8ijZehvXdwRzc6VnvqbVozCCdFzEzqhqbW"

[programs.devnet]
inertia_protocol = "8ST3LRU5gv8ijZehvXdwRzc6VnvqbVozCCdFzEzqhqbW"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
