[package]
name = "inertia-protocol"
version = "0.1.0"
description = "Trustless JIT escrow that rescues stalled Solana transactions via keeper bot acceleration"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "inertia_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
solana-instructions-sysvar = "3.0.1"
