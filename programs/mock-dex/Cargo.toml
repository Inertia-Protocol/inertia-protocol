[package]
name = "mock-dex"
version = "0.1.0"
description = "Minimal swap-shaped program for local integration testing of execute_swap's CPI relay. Not part of the protocol."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_dex"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
